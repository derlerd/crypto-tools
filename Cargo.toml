[package]
name = "modern-crypto-tools"
version = "0.1.0"
authors = ["David Derler <david@derler.info>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
curve25519-dalek = "2"
rand = "0.7"
rand_core = "0.5"
sha2 = "0.8"
digest = "0.8"
hybrid-array = "0.4.8"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "benchmarks"
harness = false
